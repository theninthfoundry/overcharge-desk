name: Overcharge Desk CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: tools:.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify financial & cryptographic security invariants
        run: |
          python -c "
          import pathlib, sys
          fin_files = [
              'tools/desk.py', 'tools/compare.py', 'tools/check_invoice.py',
              'tools/validate_comparison.py', 'tools/payment_sheet.py',
              'tools/partial_review.py', 'tools/blocked_review_report.py'
          ]
          for f in fin_files:
              txt = pathlib.Path(f).read_text(encoding='utf-8')
              if 'float(' in txt:
                  sys.exit(f'FATAL: float() banned in financial module {f}')
          "

      - name: Run test suite
        run: |
          python -m pytest -v --tb=short

      - name: Validate sample fixture files
        run: |
          python tools/check_invoice.py tests/fixtures/example_invoice.json --strict
          python tools/compare.py tests/fixtures/example_invoice.json seed/acme.json
